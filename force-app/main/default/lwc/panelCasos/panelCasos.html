
<template>
    <lightning-card>
        <div class="panel">

            <!-- Encabezado -->
            <header class="encabezado">
                <div class="icono-header">
                    <lightning-icon
                        icon-name="standard:case"
                        size="large"
                        alternative-text="Casos">
                    </lightning-icon>
                </div>

                <div>
                    <h1>Gestor de casos</h1>
                    <p>Consulta y seguimiento de casos de soporte</p>
                </div>
            </header>

            <!-- Filtro -->
            <section class="filtros">
                <div class="titulo-filtro">
                    <lightning-icon
                        icon-name="utility:filterList"
                        size="x-small"
                        alternative-text="Filtro">
                    </lightning-icon>
                    <h2>Filtrar por estado</h2>
                </div>

                <lightning-combobox
                    label="Estado del caso"
                    variant="label-hidden"
                    value={estadoSeleccionado}
                    options={opcionesEstado}
                    onchange={handleCambioEstado}>
                </lightning-combobox>
            </section>
            
            <section class="filtros">
                <div class="titulo-filtro">
                    <h2>Actualizar un caso</h2>
                </div>

                
                <lightning-input
                    type="search"
                    label="Buscar caso"
                    placeholder="Escribe el número o el asunto..."
                    value={busquedaCaso}
                    onchange={handleBuscarCaso}>
                </lightning-input>

                <template lwc:if={casosEncontrados.length}>
                    <div class="resultados-busqueda">
                        <template for:each={casosEncontrados} for:item="caso">
                            <button
                                key={caso.Id}
                                type="button"
                                class="resultado-caso"
                                data-id={caso.Id}
                                onclick={handleSeleccionarCaso}>

                                <span class="resultado-numero">
                                    #{caso.CaseNumber}
                                </span>
                                <span class="resultado-asunto">
                                    {caso.Subject}
                                </span>
                            </button>
                        </template>
                    </div>
                </template>

                <template lwc:if={casoSeleccionadoNombre}>
                    <p class="caso-elegido">
                        Caso seleccionado: {casoSeleccionadoNombre}
                    </p>
                </template>


                <lightning-combobox
                    class="slds-m-top_small"
                    label="Nuevo estado"
                    value={nuevoEstado}
                    options={opcionesEstado}
                    onchange={handleNuevoEstado}
                    placeholder="Elige el nuevo estado">
                </lightning-combobox>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Guardar cambios"
                        variant="brand"
                        onclick={handleActualizar}>
                    </lightning-button>
                </div>

                <template lwc:if={mensaje}>
                    <p class="slds-text-color_success slds-m-top_small">
                        {mensaje}
                    </p>
                </template>

                <template lwc:if={errorActualizacion}>
                    <p class="slds-text-color_error slds-m-top_small">
                        {errorActualizacion}
                    </p>
                </template>
            </section>


            <!-- Lista de casos -->
            <section class="lista-casos">
                <template lwc:if={casos.data}>
                    <template for:each={casos.data} for:item="caso">
                        <article key={caso.Id} class="tarjeta-caso">

                            <div class="icono-caso">
                                <lightning-icon
                                    icon-name="standard:case"
                                    size="medium"
                                    alternative-text="Caso">
                                </lightning-icon>
                            </div>

                            <div class="informacion-caso">
                                <span class="etiqueta">NÚMERO</span>
                                <p class="numero">
                                    {caso.CaseNumber}
                                </p>
                            </div>

                            <div class="informacion-asunto">
                                <span class="etiqueta">ASUNTO</span>
                                <p class="asunto">
                                    {caso.Subject}
                                </p>
                            </div>

                            <div class="informacion-campo">
                                <span class="etiqueta">ESTADO</span>
                                <lightning-badge
                                    label={caso.Status}>
                                </lightning-badge>
                            </div>

                            <div class="informacion-campo">
                                <span class="etiqueta">PRIORIDAD</span>
                                <lightning-badge
                                    label={caso.Priority}>
                                </lightning-badge>
                            </div>

                        </article>
                    </template>
                </template>

                <!-- Error -->
                <template lwc:if={casos.error}>
                    <div class="mensaje-error">
                        <lightning-icon
                            icon-name="utility:error"
                            size="small"
                            alternative-text="Error">
                        </lightning-icon>
                        <p>No fue posible cargar los casos.</p>
                    </div>
                </template>
            </section>


            <footer class="pie">
                <lightning-icon
                    icon-name="utility:info"
                    size="xx-small"
                    alternative-text="Información">
                </lightning-icon>
                <span>Selecciona un estado para filtrar tus casos.</span>
            </footer>

        </div>
    </lightning-card>
</template>
