<template>
    <lightning-card title="Gestor de casos">
        <template lwc:if={casos.data}>
            <lightning-combobox
                label="Filtrar por estado"
                value={estadoSeleccionado}
                options={opcionesEstado}
                onchange={handleCambioEstado}>
            </lightning-combobox>
            <template for:each={casos.data} for:item="caso">
                <div key={caso.Id} class="slds-p-around_small">
                    <p><strong>Número:</strong> {caso.CaseNumber}</p>
                    <p><strong>Asunto:</strong> {caso.Subject}</p>
                    <p><strong>Estado:</strong> {caso.Status}</p>
                    <p><strong>Prioridad:</strong> {caso.Priority}</p>
                </div>
            </template>
        </template>

        <template lwc:if={casos.error}>
            <p class="slds-p-around_small">
                No fue posible cargar los casos.
            </p>
        </template>
    </lightning-card>
</template>
